[package]
name = "infinite-mosaic-gallery"
version = "0.2.0"
edition = "2021"
description = "A local-first infinite mosaic photo wall powered by Rust and GPUI Kit"
repository = "https://github.com/weepwood/Infinite-Mosaic-Gallery"
publish = false

[dependencies]
gpui-kit = "=0.9.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
blake3 = "1.8"
dirs = "6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata]
# Source images are read-only. This MVP does not create files inside user folders.
