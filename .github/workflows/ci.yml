name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Kit Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1
      - name: Check native desktop app
        run: cargo check
      - name: Unit tests
        run: cargo test
